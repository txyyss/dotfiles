# Shared letterforms are defined in the Emacs plan below.
[buildPlans.IosevkaShengyi]
family = "Iosevka Shengyi"
spacing = "normal"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

[buildPlans.IosevkaShengyi.variants]
inherits = "ss20"

[buildPlans.IosevkaShengyi.variants.design]
zero = "long-dotted"
a = "double-storey-serifed"

[buildPlans.IosevkaShengyi.ligations]
inherits = "dlig"

[buildPlans.IosevkaShengyi.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaShengyi.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.IosevkaShengyi.weights.SemiBold]
shape = 600
menu = 600
css = 600

[buildPlans.IosevkaShengyi.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.IosevkaShengyi.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaShengyi.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

# Ghostty uses the same letterforms, width, and slopes, with terminal spacing.
[buildPlans.IosevkaTermShengyi]
family = "Iosevka Term Shengyi"
spacing = "term"
serifs = "sans"
noCvSs = true
exportGlyphNames = false
widths.inherits = "buildPlans.IosevkaShengyi"
slopes.inherits = "buildPlans.IosevkaShengyi"

[buildPlans.IosevkaTermShengyi.variants]
inherits = "buildPlans.IosevkaShengyi"

[buildPlans.IosevkaTermShengyi.ligations]
inherits = "buildPlans.IosevkaShengyi"

[buildPlans.IosevkaTermShengyi.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaTermShengyi.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.IosevkaTermShengyi.weights.Bold]
shape = 700
menu = 700
css = 700
